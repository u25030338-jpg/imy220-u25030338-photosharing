services:
  backend:
    build:
      context: ./backend
    environment:
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in the root .env file}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?Set AUTH_TOKEN_SECRET in the root .env file}
      ADMIN_ACCOUNTS_JSON: ${ADMIN_ACCOUNTS_JSON:-}
      PORT: 5000
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:5000
    ports:
      - "5174:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
